[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bike-ai-platform"
version = "0.1.0"
description = "AI platform for cycling pose data, baseline inference, annotation, evaluation, and coach review."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "opencv-python>=4.9",
  "numpy>=1.26",
  "tqdm>=4.66",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
]
app = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]
report = [
  "python-docx>=1.1",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

